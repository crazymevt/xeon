name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install SBCL on macOS
        if: runner.os == 'macOS'
        run: python tools/ci-run.py --log build/install.log -- brew install sbcl
      - name: Install SBCL on Linux
        if: runner.os == 'Linux'
        run: |
          python tools/ci-run.py --log build/apt-update.log -- sudo apt-get update
          python tools/ci-run.py --log build/install.log -- sudo apt-get install -y sbcl
      - name: Install SBCL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/ci-run.py --log build/install.log -- choco install sbcl -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sbclHome = [Environment]::GetEnvironmentVariable('SBCL_HOME', 'Machine')
          if ($sbclHome) { "SBCL_HOME=$sbclHome" >> $env:GITHUB_ENV }
          $exe = Get-ChildItem "$env:ProgramFiles\Steel Bank Common Lisp" -Filter sbcl.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'SBCL executable was not found after installation' }
          $exe.DirectoryName >> $env:GITHUB_PATH
      - name: Fetch CL-PPCRE 2.1.2
        run: python tools/ci-run.py --log build/dependency-fetch.log -- git clone --depth 1 --branch v2.1.2 https://github.com/edicl/cl-ppcre.git build/deps/cl-ppcre
      - name: Pin dependency commit
        run: python tools/ci-run.py --log build/dependency-pin.log -- git -C build/deps/cl-ppcre checkout --detach 80fb19d104647a2c4efd5f66f65811948bf8156b
      - name: Headless backend checks
        run: python tools/ci-run.py --log build/backend.log -- sbcl --noinform --no-sysinit --no-userinit --non-interactive --load tests/run.lisp
      - name: Local SBCL REPL integration
        run: python tools/ci-run.py --log build/repl.log -- sbcl --noinform --no-sysinit --no-userinit --non-interactive --load tools/check-repl.lisp
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build vendored terminal bridge
        run: python tools/ci-run.py --log build/terminal-build.log -- python tools/build-terminal.py
      - name: Emulator and real PTY / ConPTY checks
        run: python tools/ci-run.py --log build/terminal-test.log -- python tools/check-terminal.py
  package:
    needs: [test, terminal]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check out LGT
        uses: actions/checkout@v7.0.1
        with:
          repository: crazymevt/lgt
          ref: 5936a0bb1e7e38140fbd0dac36a2e223bab99c9c
          path: quicklisp/local-projects/lgt
          persist-credentials: false
      - name: Check out GTK Lisp bindings
        if: runner.os == 'Linux'
        uses: actions/checkout@v7.0.1
        with:
          repository: crazymevt/gtk4
          ref: 4f7ac6daf9de3f4fce1ca75b0f5dbf56681fac70
          path: quicklisp/local-projects/gtk4
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          python tools/ci-run.py --log build/apt-update.log -- sudo apt-get update
          python tools/ci-run.py --log build/install.log -- sudo apt-get install -y sbcl libgtk-4-1 libharfbuzz-gobject0 libsqlite3-0
          echo "XEON_SBCL=$(command -v sbcl)" >> "$GITHUB_ENV"
          echo "XEON_SBCL_HOME=/usr/lib/sbcl" >> "$GITHUB_ENV"
          echo "XEON_SBCL_NOTICE=/usr/share/doc/sbcl/copyright" >> "$GITHUB_ENV"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          python tools/ci-run.py --log build/install.log -- brew install sbcl librsvg
          prefix=$(brew --prefix sbcl)
          echo "XEON_SBCL=$prefix/libexec/bin/sbcl" >> "$GITHUB_ENV"
          echo "XEON_SBCL_HOME=$prefix/lib/sbcl" >> "$GITHUB_ENV"
          echo "XEON_SBCL_NOTICE=$prefix/COPYING" >> "$GITHUB_ENV"
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/ci-run.py --log build/install.log -- choco install sbcl -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "$env:ProgramFiles\Steel Bank Common Lisp"
          $exe = Get-ChildItem $root -Filter sbcl.exe -Recurse | Select-Object -First 1
          $core = Get-ChildItem $root -Filter sbcl.core -Recurse | Select-Object -First 1
          if (!$exe -or !$core) { throw 'SBCL executable or core image is missing' }
          $notice = Get-ChildItem $root -Filter 'COPYING*' -File -Recurse | Select-Object -First 1
          if ($notice) {
            $noticePath = $notice.FullName
          } else {
            $env:SBCL_HOME = $core.DirectoryName
            $version = (& $exe.FullName --version).Trim() -replace '^SBCL ', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected SBCL version: $version" }
            $noticePath = Join-Path $PWD 'build/SBCL-COPYING'
            Invoke-WebRequest "https://raw.githubusercontent.com/sbcl/sbcl/sbcl-$version/COPYING" -OutFile $noticePath
          }
          "XEON_SBCL=$($exe.FullName)" >> $env:GITHUB_ENV
          "XEON_SBCL_HOME=$($core.DirectoryName)" >> $env:GITHUB_ENV
          "XEON_SBCL_NOTICE=$noticePath" >> $env:GITHUB_ENV
      - name: Resolve Lisp dependencies
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://beta.quicklisp.org/quicklisp.lisp --output quicklisp.lisp
          heap=()
          if [[ "$RUNNER_OS" == Linux ]]; then heap=(--dynamic-space-size 4096); fi
          SBCL_HOME="$XEON_SBCL_HOME" python tools/ci-run.py --log build/quicklisp.log -- "$XEON_SBCL" "${heap[@]}" --script packaging/prepare.lisp
      - name: Build terminal bridge
        run: python tools/ci-run.py --log build/terminal-build.log -- python tools/build-terminal.py
      - name: Build app-private native libraries
        run: python tools/ci-run.py --log build/native-bundle.log -- python tools/build-http-bundle.py --include-sqlite
      - name: Stage, smoke test, and archive Xeon
        shell: bash
        run: |
          python tools/ci-run.py --log build/package.log -- python tools/package-xeon.py \
            --output build/dist --quicklisp quicklisp --sbcl "$XEON_SBCL" \
            --sbcl-home "$XEON_SBCL_HOME" --sbcl-notice "$XEON_SBCL_NOTICE"
      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: xeon-${{ matrix.os }}
          path: build/dist/xeon-*
          if-no-files-found: error
